name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Audit the repository
        run: python3 tools/check_repo.py

      - name: Scan the tracked tree for personal data
        run: |
          set -euo pipefail
          # Nothing personal may be tracked. check_repo.py covers the known
          # paths; this catches anything that slips in under a new name.
          #
          # The vendored portal CLIs under .agents/ are upstream code. Their
          # test fixtures contain synthetic addresses on purpose, so they are
          # excluded here - they are not this project's files to police.
          tracked="$(git ls-files | grep -v '^\.agents/' || true)"

          if printf '%s\n' "$tracked" \
              | grep -E '^(resumes|profiles|reports)/' \
              | grep -vE '^(resumes|profiles)/README\.md$'; then
            echo "::error::personal data is tracked"
            exit 1
          fi

          # An email address that is not an obvious placeholder.
          if printf '%s\n' "$tracked" \
              | grep -E '\.(md|py|ya?ml|json|jsonc|txt)$' \
              | xargs -r git grep -nIE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' -- \
                  | grep -vE '@(example\.(com|org|net)|evil\.(io|example)|localhost|test)' \
              | grep -vE '^\S+:\s*#' ; then
            echo "::error::an email address is present in a tracked file"
            exit 1
          fi

      - name: Build the profile tools
        run: python3 -m compileall -q tools

  tools:
    name: Tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # The drift guard reads each portal's own `search --help`, so the
      # portal CLIs have to be installed for it to mean anything.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install from the lockfile
        run: bun install --frozen-lockfile

      - name: Run the tool tests
        run: python3 -m unittest discover -s tools/tests -t .

  portals:
    name: Portal CLI tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        portal:
          - freehire-search
          - jobicy-search
          - linkedin-search
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install from the lockfile
        run: bun install --frozen-lockfile

      - name: Run the portal tests
        working-directory: .agents/skills/${{ matrix.portal }}/cli
        run: bun test

      - name: Typecheck the portal
        working-directory: .agents/skills/${{ matrix.portal }}/cli
        run: bun run typecheck

  workspace:
    name: Workspace scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install from the lockfile
        run: bun install --frozen-lockfile

      # bun test does not descend into workspace members from the root, so
      # the root scripts drive the members through --filter instead.
      - name: Run every portal suite through the workspace script
        run: bun run test

      - name: Typecheck every portal through the workspace script
        run: bun run typecheck
